<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Super Web Experience</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Dynamic background glow element */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            transition: transform 0.1s ease-out;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 600px;
            width: 90%;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .interactive-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .interactive-box:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        #counter {
            font-size: 1.5rem;
            color: var(--accent-color);
            font-weight: bold;
            display: inline-block;
            margin-top: 0.5rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow" id="glow"></div>

    <div class="container">
        <h1>Welcome to The Super Web</h1>
        <p>A high-performance template blending HTML, modern CSS styling, and dynamic JavaScript interactivity.</p>
        
        <div class="interactive-box">
            <span>Interaction Count:</span><br>
            <span id="counter">0</span>
        </div>

        <button class="btn" id="superBtn">Trigger Magic</button>
    </div>

    <script>
        // JavaScript Logic for Interactivity

        // 1. Interactive Button Click Counter & Dynamic Feedback
        const superBtn = document.getElementById('superBtn');
        const counterDisplay = document.getElementById('counter');
        let count = 0;

        superBtn.addEventListener('click', () => {
            count++;
            counterDisplay.textContent = count;
            
            // Subtle pop animation effect on click
            counterDisplay.style.transform = 'scale(1.3)';
            setTimeout(() => {
                counterDisplay.style.transform = 'scale(1)';
            }, 200);

            // Change button color hue dynamically based on clicks
            const hue = (count * 30) % 360;
            superBtn.style.background = `linear-gradient(135deg, hsl(${hue}, 80%, 50%), hsl(${(hue + 60) % 360}, 80%, 50%))`;
        });

        // 2. Ambient Mouse Movement Glow Effect
        const glow = document.getElementById('glow');

        window.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;

            // Smoothly move the glow element matching cursor coordinates (centered)
            glow.style.transform = `translate(${x - 200}px, ${y - 200}px)`;
        });
    </script>
</body>
</html>
